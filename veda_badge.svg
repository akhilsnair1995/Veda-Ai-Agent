<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a148c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#880e4f;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Main Badge Shape -->
  <rect x="10" y="10" width="380" height="100" rx="15" fill="url(#bg-grad)" filter="url(#shadow)" stroke="#ffffff" stroke-width="2"/>

  <!-- Stylized Neem Leaf Icon (Serrated) -->
  <g transform="translate(45, 60) scale(1.2) rotate(-15)">
    <path d="M0,0 C-10,-10 -15,-25 0,-45 C15,-25 10,-10 0,0" fill="#ffffff" />
    <!-- Serrations -->
    <path d="M0,0 L-4,-6 L-2,-7 L-6,-13 L-4,-14 L-8,-21 L-6,-22 L-10,-30 L-8,-31 L0,-45 
             L8,-31 L6,-30 L10,-22 L8,-21 L12,-14 L10,-13 L6,-7 L8,-6 Z" fill="#81c784" />
    <!-- Stem/Vein -->
    <line x1="0" y1="0" x2="0" y2="-40" stroke="#1b5e20" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="110" y="75" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="8">VEDA</text>
  
  <!-- Subtitle -->
  <text x="115" y="95" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#e1bee7" letter-spacing="2" opacity="0.8">INDEPENDENT MEP INTELLIGENCE</text>
</svg>
