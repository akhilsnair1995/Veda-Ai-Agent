<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main 3D Gradient: Top (Green) to Bottom (Brown) -->
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" /> <!-- Emerald Green -->
      <stop offset="100%" style="stop-color:#5d4037;stop-opacity:1" /> <!-- Deep Brown -->
    </linearGradient>
    
    <!-- Glossy Highlight for 3D effect -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>

    <!-- Drop Shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Circle with 3D Body -->
  <circle cx="100" cy="100" r="90" fill="url(#bodyGradient)" filter="url(#shadow)" stroke="#3e2723" stroke-width="2"/>
  
  <!-- Glossy Overlay -->
  <circle cx="100" cy="100" r="90" fill="url(#gloss)" />

  <!-- Veda 'V' Symbol -->
  <path d="M60 60 L100 140 L140 60" fill="none" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.5))" />
  
  <!-- Text -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" style="text-shadow: 1px 1px 2px black;">VEDA</text>
</svg>
