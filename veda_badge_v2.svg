<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep AI Dark -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a2a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Emerald Leaf Gradient -->
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffa3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a36c;stop-opacity:1" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" rx="20" fill="url(#bg-grad)"/>

  <!-- Geometric Neem Leaf (Minimalist) -->
  <g transform="translate(60, 100) scale(1.8)" filter="url(#glow)">
    <!-- Main Leaf Body -->
    <path d="M0,0 C0,-10 10,-30 25,-40 C10,-35 0,-20 0,-10 C0,-20 -10,-35 -25,-40 C-10,-30 0,-10 0,0" fill="url(#leaf-grad)" />
    <!-- Center Vein -->
    <line x1="0" y1="-5" x2="0" y2="-38" stroke="#00ffa3" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <!-- Tech Accent Dots -->
    <circle cx="0" cy="0" r="2" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- VEDA Text (Ultra Modern) -->
  <text x="160" y="115" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="100" fill="#ffffff" letter-spacing="25" style="filter: url(#glow);">VEDA</text>
  
  <!-- Sub-Branding -->
  <rect x="165" y="135" width="350" height="1" fill="#ffffff" opacity="0.2"/>
  <text x="165" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00ffa3" letter-spacing="4">INDEPENDENT MEP INTELLIGENCE</text>
  
  <!-- "Online" Indicator -->
  <circle cx="540" cy="40" r="4" fill="#00ffa3" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="555" y="45" font-family="Arial, sans-serif" font-size="10" fill="#00ffa3" font-weight="bold">SYSTEM ACTIVE</text>
</svg>
